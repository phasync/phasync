name: 🧪 CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: ⚙️ Running test for PHP ${{ matrix.php }}

    env:
      # phasync must behave the same with and without the extension, so the suite runs both
      # ways. Bump deliberately; the release tree bundles a binary per PHP version.
      PHASYNC_EXT_VERSION: 0.4.0-alpha10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: Check commit messages
        uses: webiny/action-conventional-commits@v1.3.0

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: ✅ Validate composer.json and composer.lock
        run: composer validate --strict

      - name: 📦 Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 🔍 Check php-cs-fixer
        run: composer php-cs-fixer-dry-run

      - name: ✅ Tests
        run: composer test-with-coverage

      - name: 📥 Download phasync-ext
        run: |
          curl -fsSL -o "$RUNNER_TEMP/phasync.so" \
            "https://raw.githubusercontent.com/phasync/phasync-ext/$PHASYNC_EXT_VERSION/bin/phasync-${{ matrix.php }}-nts-x86_64-glibc.so"
          php -d extension="$RUNNER_TEMP/phasync.so" -r 'extension_loaded("phasync") || exit(1); echo "phasync-ext ", phpversion("phasync"), "\n";'

      - name: ✅ Tests with phasync-ext
        run: php -d extension="$RUNNER_TEMP/phasync.so" vendor/bin/pest --stop-on-defect

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.php == '8.2'
