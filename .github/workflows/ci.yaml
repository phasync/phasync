name: 🧪 CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: ⚙️ Running test for PHP ${{ matrix.php }}

    # phasync must behave the same with and without the extension, so the suite runs both ways:
    # the second time with phasync-ext built from its main branch
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: Check commit messages
        uses: webiny/action-conventional-commits@v1.3.0

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: ✅ Validate composer.json and composer.lock
        run: composer validate --strict

      - name: 📦 Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 🔍 Check php-cs-fixer
        run: composer php-cs-fixer-dry-run

      - name: ✅ Tests
        run: composer test-with-coverage

      - name: 📥 Checkout phasync-ext main
        uses: actions/checkout@v6
        with:
          repository: phasync/phasync-ext
          path: phasync-ext

      - name: 🔨 Build phasync-ext
        working-directory: phasync-ext
        run: |
          phpize && ./configure --enable-phasync
          php build/gen_stub.php -f phasync.stub.php  # the committed arginfo targets the newest PHP
          make -j"$(nproc)"
          cp modules/phasync.so "$RUNNER_TEMP/phasync.so"
          php -d extension="$RUNNER_TEMP/phasync.so" -r 'extension_loaded("phasync") || exit(1); echo "phasync-ext ", phpversion("phasync"), "\n";'

      - name: ✅ Tests with phasync-ext
        run: php -d extension="$RUNNER_TEMP/phasync.so" vendor/bin/pest --stop-on-defect

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.php == '8.2'

  windows:
    runs-on: windows-latest

    name: 🪟 Process tests on Windows

    # Only the process tests run here, not the whole suite: large parts of it assume POSIX
    # (stream_socket_pair(STREAM_PF_UNIX, ...), pcntl_*, posix_*), unrelated to Process itself
    # and out of scope for issue #45 -- tracked separately (phasync/phasync#64).
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: ✅ Process tests
        run: vendor/bin/pest tests/ProcessTest.php tests/Characterization/ProcessTest.php tests/Characterization/ProcessWindowsTest.php --stop-on-defect

  psr-http-message:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["1.0.1", "1.1", "2.0"]

    name: 📨 PSR-7 with psr/http-message ${{ matrix.version }}

    # Applications may depend on any psr/http-message version, so phasync's messages must satisfy
    # every one: untyped parameters, v2's return types
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📥 Install dependencies
        run: composer require --no-progress --no-interaction -W "psr/http-message:${{ matrix.version }}"

      - name: ✅ PSR-7 tests
        run: vendor/bin/pest tests/PsrConformanceTest.php
