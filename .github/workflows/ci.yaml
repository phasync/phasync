name: 🧪 CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: ⚙️ Running test for PHP ${{ matrix.php }}

    # For tests/MySQLiAwaiterTest.php (skipped when PHASYNC_TEST_MYSQL is unset); data on tmpfs, as an
    # image's VOLUME would leave an anonymous volume per run
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24

    env:
      PHASYNC_TEST_MYSQL: 127.0.0.1:3306:root:test

    # phasync must behave the same with and without the extension, so the suite runs both ways:
    # the second time with the extension built from phasync/ext-phasync
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: Check commit messages
        uses: webiny/action-conventional-commits@v1.4.2

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: phpize
          coverage: pcov   # unlike xdebug it loads alongside the phasync extension, whose run is measured too

      - name: ✅ Validate composer.json and composer.lock
        run: composer validate --strict

      - name: 📦 Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 🔍 Check php-cs-fixer
        run: composer php-cs-fixer-dry-run

      - name: ✅ Tests
        run: composer test-with-coverage

      - name: 🔗 Every allowed major version of the PSR packages
        run: php tests/psr-versions.php

      - name: 📥 Checkout the extension
        if: matrix.php != '8.2'   # the extension needs PHP 8.3 or later
        uses: actions/checkout@v7
        with:
          # the private source repository while phasync/ext-phasync is not public yet
          repository: ${{ secrets.EXT_SRC_DEPLOY_KEY && 'phasync/phasync-ext-src' || 'phasync/ext-phasync' }}
          ref: ${{ secrets.EXT_SRC_DEPLOY_KEY && 'open-core' || 'main' }}
          ssh-key: ${{ secrets.EXT_SRC_DEPLOY_KEY }}
          path: ext-phasync

      - name: 🛠 Build the extension
        id: ext
        if: matrix.php != '8.2'
        run: |
          sudo apt-get install -y -q --no-install-recommends libxml2-dev libsqlite3-dev >/dev/null
          cd ext-phasync
          phpize >/dev/null
          ./configure -q --enable-phasync
          make -s -j"$(nproc)" >/dev/null
          php -d extension="$PWD/modules/phasync.so" -r 'exit(extension_loaded("phasync") ? 0 : 1);'
          echo "so=$PWD/modules/phasync.so" >> "$GITHUB_OUTPUT"

      - name: ✅ Tests with the phasync extension
        if: steps.ext.outputs.so
        run: |
          # bin/phasync loads it through PHP_INI_SCAN_DIR, so the PHP processes the tests start load it too
          # one job also measures this run: Codecov merges it with the one without the extension
          COVERAGE=""
          if [ "${{ matrix.php }}" = "8.5" ]; then COVERAGE="--coverage-clover clover-ext.xml"; fi
          PHASYNC_EXT_SO="${{ steps.ext.outputs.so }}" php bin/phasync vendor/bin/pest --stop-on-defect $COVERAGE

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clover.xml
          flags: plain
        if: matrix.php == '8.2'

      - name: 📤 Upload coverage of the run with the extension to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clover-ext.xml
          flags: ext
        if: matrix.php == '8.5' && steps.ext.outputs.so

  windows:
    runs-on: windows-latest

    name: 🪟 Process tests on Windows

    # Only the process tests run here, not the whole suite: large parts of it assume POSIX
    # (stream_socket_pair(STREAM_PF_UNIX, ...), pcntl_*, posix_*), unrelated to Process itself
    # and out of scope for issue #45 -- tracked separately (phasync/phasync#64).
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: ✅ Process tests
        run: vendor/bin/pest tests/ProcessTest.php tests/Characterization/ProcessTest.php tests/Characterization/ProcessWindowsTest.php --stop-on-defect

  psr-http-message:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["1.0.1", "1.1", "2.0"]

    name: 📨 PSR-7 with psr/http-message ${{ matrix.version }}

    # Applications may depend on any psr/http-message version, so phasync's messages must satisfy
    # every one: untyped parameters, v2's return types
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📥 Install dependencies
        run: composer require --no-progress --no-interaction -W "psr/http-message:${{ matrix.version }}"

      - name: ✅ PSR-7 tests
        run: vendor/bin/pest tests/PsrConformanceTest.php

  psr-log:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["1.1.4", "2.0.0", "3.0.2"]

    name: 📝 PSR-3 with psr/log ${{ matrix.version }}

    # Applications may depend on any psr/log version, so ConsoleLogger must satisfy every one
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📥 Install dependencies
        run: composer require --no-progress --no-interaction -W "psr/log:${{ matrix.version }}"

      - name: ✅ PSR-3 tests
        run: vendor/bin/pest tests/ConsoleLoggerTest.php
